name: Update hero brief

# Every morning, check the Ghost RSS feed. If a new brief is out, recapture it
# on the phone mockup and republish the site. Otherwise do nothing.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 Paris (08:00 in summer)
  workflow_dispatch:
    inputs:
      force:
        description: "Recapture even if the brief hasn't changed"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: update-brief
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install WebP tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Check for a new brief and capture it
        id: brief
        env:
          CHROME_PATH: google-chrome
          FORCE: ${{ inputs.force || 'false' }}
        run: node .github/scripts/update-brief.mjs

      - name: Commit and republish
        if: steps.brief.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.brief.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/img/brief-screen.webp
          if git diff --cached --quiet; then echo "No file changes."; exit 0; fi
          git commit -m "Hero: show latest brief — $TITLE"
          git push
          # pushes made by this workflow don't always trigger Pages, so request a build
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || true
